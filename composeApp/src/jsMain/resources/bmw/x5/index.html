<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting…</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://drivebit.ru/search/bmw/x5">
    <meta http-equiv="refresh" content="0; url=/search/bmw/x5">
    <script>
        (function () {
            var base = (typeof window !== "undefined" && window.__DRIVEBIT_BASE__) || "";
            var target = "/search/bmw/x5";
            if (base && target.indexOf(base) !== 0) target = base + target;
            location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Страница переехала: <a href="/search/bmw/x5">drivebit.ru/search/bmw/x5</a></p>
</body>
</html>
