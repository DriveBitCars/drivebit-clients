<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveBit - Аренда автомобилей</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        #root {
            width: 100%;
            height: 100vh;
        }

        /* Адаптивные отступы */
        @media (max-width: 768px) {
            #root {
                padding: 0 10px;
            }
        }

        @media (max-width: 480px) {
            #root {
                padding: 0 5px;
            }
        }

        /* Адаптивная высота картинки */
        @media (max-width: 768px) {
            .filter-background {
                height: 150px !important;
            }
        }

        @media (max-width: 480px) {
            .filter-background {
                height: 120px !important;
            }
        }


        /* Hover эффект для кнопок фильтров */
        .universal-button:hover:not([style*="background-color: rgb(0, 0, 0)"]) {
            background-color: #E0E0E6 !important;
        }

        /* Hover эффект для элементов меню */
        .butter-menu-item:hover {
            background-color: #F5F5F5 !important;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script src="composeApp.js"></script>
</body>
</html>
