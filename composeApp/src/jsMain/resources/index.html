<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveBit - Аренда автомобилей</title>
    <meta name="description" content="Аренда автомобилей от собственников. Дешевле проката на 40%. Полная страховка. Поддержка 24/7.">
    <meta property="og:title" content="DriveBit - Аренда автомобилей">
    <meta property="og:description" content="Аренда автомобилей от собственников. Дешевле проката на 40%. Полная страховка. Поддержка 24/7.">
    <meta property="og:type" content="website">
    <link rel="canonical" href="/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, system-ui, sans-serif;
        }
        #root {
            width: 100%;
            height: 100vh;
        }

        /* Адаптивные отступы */
        @media (max-width: 768px) {
            #root {
                padding: 0 10px;
            }
        }

        @media (max-width: 480px) {
            #root {
                padding: 0 5px;
            }
        }

        /* Адаптивная высота картинки */
        @media (max-width: 768px) {
            .filter-background {
                height: 150px !important;
            }
        }

        @media (max-width: 480px) {
            .filter-background {
                height: 120px !important;
            }
        }


        /* Hover эффект для кнопок фильтров */
        .universal-button:hover:not([style*="background-color: rgb(0, 0, 0)"]) {
            background-color: #E0E0E6 !important;
        }

        /* Hover эффект для элементов меню */
        .butter-menu-item:hover {
            background-color: #F5F5F5 !important;
            border-radius: 8px;
        }

        /* Анимация спиннера загрузки */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div id="root"></div>
<noscript>
    <div style="padding: 40px; text-align: center; font-family: system-ui, sans-serif;">
        <h1>DriveBit - Аренда автомобилей</h1>
        <p>Аренда автомобилей от собственников. Дешевле проката на 40%. Полная страховка. Поддержка 24/7.</p>
        <p><a href="/login" style="color: #2563eb; text-decoration: none;">Войти в аккаунт</a> | <a href="/signup" style="color: #2563eb; text-decoration: none;">Регистрация</a></p>
        <p style="color: #666; font-size: 14px;">Для работы приложения необходимо включить JavaScript.</p>
    </div>
</noscript>
<script src="composeApp.js"></script>
</body>
</html>
