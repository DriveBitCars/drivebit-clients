<!-- drivebit-hero-start -->
<div class="drivebit-hero-wrap">
<section id="drivebit-hero-static" class="drivebit-hero-static" aria-label="Поиск автомобиля">
  <img id="drivebit-hero-bg" class="drivebit-hero-bg" src="__BACKGROUND_URL__" alt="" fetchpriority="high" decoding="async" />
  <div class="drivebit-hero-overlay" aria-hidden="true"></div>
  <div class="drivebit-hero-inner">
    <h1 id="drivebit-hero-headline" class="drivebit-hero-headline">__HEADLINE__</h1>
    <p class="drivebit-hero-tagline">Чистые и ухоженные машины с низким пробегом</p>
    <p class="drivebit-hero-sub">Дешевле каршеринга</p>
    <div class="drivebit-hero-toolbar">
      <div class="drivebit-hero-dates" id="drivebit-hero-dates">
        <button type="button" class="drivebit-hero-date-trigger" id="drivebit-hero-start-trigger" aria-label="Начало аренды">
          <span class="drivebit-hero-date-copy">
            <span class="drivebit-hero-date-label drivebit-hero-date-label--desktop">Начало аренды</span>
            <span class="drivebit-hero-date-label drivebit-hero-date-label--mobile">с</span>
            <span class="drivebit-hero-date-value is-empty" id="drivebit-hero-start-display">выберите даты</span>
          </span>
          <span class="drivebit-hero-date-icon" aria-hidden="true"></span>
        </button>
        <span class="drivebit-hero-dates-divider" aria-hidden="true"></span>
        <button type="button" class="drivebit-hero-date-trigger" id="drivebit-hero-end-trigger" aria-label="Завершение аренды">
          <span class="drivebit-hero-date-copy">
            <span class="drivebit-hero-date-label drivebit-hero-date-label--desktop">Завершение аренды</span>
            <span class="drivebit-hero-date-label drivebit-hero-date-label--mobile">по</span>
            <span class="drivebit-hero-date-value is-empty" id="drivebit-hero-end-display">выберите даты</span>
          </span>
          <span class="drivebit-hero-date-icon" aria-hidden="true"></span>
        </button>
      </div>
      <button type="button" id="drivebit-hero-search-btn" class="drivebit-hero-search-btn">Найти автомобиль</button>
    </div>
  </div>
</section>
</div>
<!-- drivebit-hero-end -->
