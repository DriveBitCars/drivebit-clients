name: Deploy to GitHub Pages

on:
  push:
    branches: [ trunk ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
        key: pages-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          pages-gradle-
          gradle-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build JS distribution
      run: |
        echo "🔨 Building JS distribution..."
        ./gradlew :composeApp:jsBrowserDistribution --no-daemon --stacktrace || exit 1
        echo "✅ Build completed"

    - name: Prepare dist directory
      run: |
        echo "📦 Preparing dist directory..."

        # Check if build directory exists
        if [ ! -d "composeApp/build/dist/js/productionExecutable" ]; then
          echo "❌ Build directory not found!"
          echo "📁 Available directories:"
          find composeApp/build -type d 2>/dev/null | head -10 || echo "No build directory found"
          exit 1
        fi

        # Create dist directory
        mkdir -p dist

        # Copy built files
        cp -r composeApp/build/dist/js/productionExecutable/* dist/ || exit 1

        if [ -d "images" ]; then
          cp -r images dist/
          echo "✅ Copied images"
        fi

        # Add .nojekyll
        touch dist/.nojekyll

        # Verify index.html exists
        if [ ! -f "dist/index.html" ]; then
          echo "❌ index.html not found in dist!"
          echo "📁 Files in dist:"
          ls -la dist/ || echo "Dist directory is empty"
          exit 1
        fi

        echo "📁 Dist files:"
        ls -la dist/

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: 'dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Success notification
      run: |
        echo "✅ Successfully deployed to gh-pages branch!"
        echo "🌐 Your site will be available at: https://antonbutov.github.io/drivebit-clients/"
