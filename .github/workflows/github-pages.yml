name: Deploy to GitHub Pages

on:
  push:
    branches: [ trunk ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
        key: pages-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          pages-gradle-
          gradle-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build JS distribution
      run: |
        echo "🔨 Building JS distribution..."
        ./gradlew :composeApp:jsBrowserDistribution :carDetailApp:jsBrowserDistribution :myCarsApp:jsBrowserDistribution :chatsApp:jsBrowserDistribution :authApp:jsBrowserDistribution :accountApp:jsBrowserDistribution :profileApp:jsBrowserDistribution --no-daemon --stacktrace || exit 1
        echo "✅ Build completed"

    - name: Merge split bundles into main dist
      run: |
        set -e
        DIST="composeApp/build/dist/js/productionExecutable"
        CARDET="carDetailApp/build/dist/js/productionExecutable"
        cp "$CARDET/carDetail.js" "$DIST/"
        cp -r "$CARDET/car-detail" "$DIST/"
        cp -r "$CARDET/car-photos-gallery" "$DIST/"
        test -f "$DIST/car-detail/index.html"
        test -f "$DIST/carDetail.js"
        MYCARS="myCarsApp/build/dist/js/productionExecutable"
        cp "$MYCARS/myCars.js" "$DIST/"
        cp -r "$MYCARS/my-cars" "$DIST/"
        test -f "$DIST/my-cars/index.html"
        test -f "$DIST/myCars.js"
        CHATS="chatsApp/build/dist/js/productionExecutable"
        cp "$CHATS/chats.js" "$DIST/"
        cp -r "$CHATS/chats" "$DIST/"
        cp -r "$CHATS/chat" "$DIST/"
        test -f "$DIST/chats/index.html"
        test -f "$DIST/chat/index.html"
        test -f "$DIST/chats.js"
        AUTH="authApp/build/dist/js/productionExecutable"
        cp "$AUTH/auth.js" "$DIST/"
        cp -r "$AUTH/login-by-phone" "$DIST/"
        test -f "$DIST/login-by-phone/index.html"
        test -f "$DIST/auth.js"
        ACCOUNT="accountApp/build/dist/js/productionExecutable"
        cp "$ACCOUNT/account.js" "$DIST/"
        test -f "$DIST/account.js"
        PROFILE="profileApp/build/dist/js/productionExecutable"
        cp "$PROFILE/profile.js" "$DIST/"
        cp -r "$PROFILE/profile" "$DIST/"
        test -f "$DIST/profile/index.html"
        test -f "$DIST/profile.js"
        for brand in bmw audi; do
          if [ ! -f "$DIST/$brand/index.html" ] && [ -f "composeApp/src/jsMain/resources/$brand/index.html" ]; then
            mkdir -p "$DIST/$brand"
            cp "composeApp/src/jsMain/resources/$brand/index.html" "$DIST/$brand/index.html"
          fi
        done
        if [ ! -f "$DIST/rostov-na-donu/index.html" ] && [ -d "composeApp/src/jsMain/resources/rostov-na-donu" ]; then
          cp -R "composeApp/src/jsMain/resources/rostov-na-donu" "$DIST/"
        fi
        mkdir -p "$DIST/search"
        cp "composeApp/src/jsMain/resources/search/index.html" "$DIST/search/index.html"
        echo "split bundles merged OK"

    - name: Prepare dist directory
      run: |
        echo "📦 Preparing dist directory..."

        # Check if build directory exists
        if [ ! -d "composeApp/build/dist/js/productionExecutable" ]; then
          echo "❌ Build directory not found!"
          exit 1
        fi

        # Create dist directory
        mkdir -p dist

        # Copy built files (includes resources from jsMain/resources automatically)
        cp -r composeApp/build/dist/js/productionExecutable/* dist/ || exit 1

        # Add .nojekyll
        touch dist/.nojekyll
        
        # Add CNAME file for custom domain
        echo "dev.drivebit.ru" > dist/CNAME

        # Copy list-your-car.html if it exists
        if [ -f "list-your-car.html" ]; then
            echo "📄 Copying list-your-car.html..."
            cp list-your-car.html dist/
            echo "✅ list-your-car.html copied"
        else
            echo "⚠️  list-your-car.html not found in root"
        fi
        
        echo "📄 robots.txt and other jsMain/resources/ assets are included in the JS bundle output"

        # Verify index.html exists
        if [ ! -f "dist/index.html" ]; then
            echo "❌ index.html not found in dist!"
            exit 1
        fi

        echo "📁 Dist files:"
        ls -la dist/
        
        # Verify images are included
        if [ -d "dist/images" ]; then
          echo "✅ Images directory found"
          echo "📸 Images count: $(find dist/images -type f | wc -l | tr -d ' ') files"
          if [ -f "dist/images/logos/turo_logo.svg" ]; then
            echo "✅ turo_logo.svg found"
          else
            echo "⚠️  turo_logo.svg not found!"
          fi
        else
          echo "⚠️  Images directory not found!"
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: 'dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Success notification
      run: |
        echo "✅ Successfully deployed to gh-pages branch!"
        echo "🌐 Your site will be available at: https://drivebitcars.github.io/drivebit-clients/"
