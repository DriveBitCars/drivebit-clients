name: Deploy

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy web (atomic)
    runs-on: ubuntu-latest
    env:
      DEPLOY_ROOT: /var/www/drivebit-clients

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules/
          **/node_modules/
        key: node-modules-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
        restore-keys: |
          node-modules-

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
        key: deploy-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          deploy-gradle-
          gradle-

    - name: Cache build outputs
      uses: actions/cache@v4
      with:
        path: |
          build/
          .gradle/
          ~/.gradle/build-cache/
        key: deploy-build-${{ hashFiles('**/*.kt', '**/*.gradle*') }}
        restore-keys: |
          deploy-build-
          build-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Clean build cache
      run: ./gradlew clean --no-daemon

    - name: Build JS distribution (fast web version)
      run: ./gradlew :composeApp:jsBrowserDistribution :carDetailApp:jsBrowserDistribution :myCarsApp:jsBrowserDistribution :chatsApp:jsBrowserDistribution :authApp:jsBrowserDistribution :accountApp:jsBrowserDistribution :profileApp:jsBrowserDistribution --no-daemon

    - name: Merge split bundles into main dist
      run: |
        set -e
        DIST="composeApp/build/dist/js/productionExecutable"
        CARDET="carDetailApp/build/dist/js/productionExecutable"
        cp "$CARDET/carDetail.js" "$DIST/"
        cp "$CARDET/carDetail.js.map" "$DIST/" 2>/dev/null || true
        cp -r "$CARDET/car-detail" "$DIST/"
        cp -r "$CARDET/car-photos-gallery" "$DIST/"
        test -f "$DIST/car-detail/index.html"
        test -f "$DIST/car-photos-gallery/index.html"
        test -f "$DIST/carDetail.js"
        MYCARS="myCarsApp/build/dist/js/productionExecutable"
        cp "$MYCARS/myCars.js" "$DIST/"
        cp "$MYCARS/myCars.js.map" "$DIST/" 2>/dev/null || true
        for route in create-car my-cars car-edit address-input car-sts-upload passport-upload city-selection; do
          if [ -d "$MYCARS/$route" ]; then
            cp -r "$MYCARS/$route" "$DIST/"
          fi
        done
        for route in create-car my-cars car-edit address-input car-sts-upload passport-upload city-selection; do
          test -f "$DIST/$route/index.html"
        done
        test -f "$DIST/myCars.js"
        CHATS="chatsApp/build/dist/js/productionExecutable"
        cp "$CHATS/chats.js" "$DIST/"
        cp "$CHATS/chats.js.map" "$DIST/" 2>/dev/null || true
        for route in chats chat; do
          if [ -d "$CHATS/$route" ]; then
            cp -r "$CHATS/$route" "$DIST/"
          fi
        done
        test -f "$DIST/chats/index.html"
        test -f "$DIST/chat/index.html"
        test -f "$DIST/chats.js"
        AUTH="authApp/build/dist/js/productionExecutable"
        cp "$AUTH/auth.js" "$DIST/"
        cp "$AUTH/auth.js.map" "$DIST/" 2>/dev/null || true
        for route in verify-otp login-by-phone login-by-mail login-by-password; do
          if [ -d "$AUTH/$route" ]; then
            cp -r "$AUTH/$route" "$DIST/"
          fi
        done
        test -f "$DIST/login-by-phone/index.html"
        test -f "$DIST/auth.js"
        ACCOUNT="accountApp/build/dist/js/productionExecutable"
        cp "$ACCOUNT/account.js" "$DIST/"
        cp "$ACCOUNT/account.js.map" "$DIST/" 2>/dev/null || true
        for route in my-bookings my-deals documents payment change-email; do
          if [ -d "$ACCOUNT/$route" ]; then
            cp -r "$ACCOUNT/$route" "$DIST/"
          fi
        done
        test -f "$DIST/account.js"
        PROFILE="profileApp/build/dist/js/productionExecutable"
        cp "$PROFILE/profile.js" "$DIST/"
        cp "$PROFILE/profile.js.map" "$DIST/" 2>/dev/null || true
        if [ -d "$PROFILE/profile" ]; then
          cp -r "$PROFILE/profile" "$DIST/"
        fi
        test -f "$DIST/profile/index.html"
        test -f "$DIST/profile.js"
        # Short brand landings must stay at dist root (SEO + Callibri)
        for brand in bmw audi; do
          if [ ! -f "$DIST/$brand/index.html" ] && [ -f "composeApp/src/jsMain/resources/$brand/index.html" ]; then
            mkdir -p "$DIST/$brand"
            cp "composeApp/src/jsMain/resources/$brand/index.html" "$DIST/$brand/index.html"
          fi
        done
        if [ ! -f "$DIST/rostov-na-donu/index.html" ] && [ -d "composeApp/src/jsMain/resources/rostov-na-donu" ]; then
          cp -R "composeApp/src/jsMain/resources/rostov-na-donu" "$DIST/"
        fi
        # /search must remain the redirect stub (city from my_city_slug, fallback moskva)
        mkdir -p "$DIST/search"
        cp "composeApp/src/jsMain/resources/search/index.html" "$DIST/search/index.html"
        echo "split bundles merged OK"

    - name: Verify Moscow SEO pages in dist
      run: |
        set -euo pipefail
        DIST="composeApp/build/dist/js/productionExecutable"
        fail() { echo "SEO verify failed: $*" >&2; exit 1; }
        test -f "$DIST/moskva/poblizosti/index.html" || fail "missing moskva/poblizosti"
        grep -q 'drivebit-cars-grid-static' "$DIST/moskva/poblizosti/index.html" || fail "poblizosti grid"
        grep -q 'src="/composeApp.js' "$DIST/moskva/arenda-avto-ekonom-klassa-bez-voditelya/index.html" || fail "ekonom composeApp.js"
        for slug in "" arenda-avto-v-krym arenda-avto-v-belarus arenda-avto-v-abkhaziyu arenda-avto-ekonom-klassa-bez-voditelya arenda-avto-komfort-klassa-bez-voditelya arenda-avto-biznes-klassa-bez-voditelya arenda-avto-premium-klassa-bez-voditelya arenda-minivena-bez-voditelya arenda-vnedorozhnika-bez-voditelya poblizosti; do
          if [ -z "$slug" ]; then
            page="$DIST/moskva/index.html"
          else
            page="$DIST/moskva/$slug/index.html"
          fi
          test -f "$page" || fail "missing $page"
        done
        echo "Moscow SEO landing pages OK"
        test -f "$DIST/bmw/index.html" || fail "missing bmw/index.html (ls=$(ls -la "$DIST" | head))"
        grep -q 'drivebit-seo-text' "$DIST/bmw/index.html" || fail "bmw seo-text"
        grep -q 'drivebit-page-headline' "$DIST/bmw/index.html" || fail "bmw headline"
        grep -q '<h1' "$DIST/bmw/index.html" || fail "bmw h1"
        grep -q 'Аренда BMW без водителя в Москве' "$DIST/bmw/index.html" || fail "bmw h1 text"
        grep -q 'callibri.js' "$DIST/bmw/index.html" || fail "bmw Callibri"
        grep -q 'drivebit-third-party-deferred' "$DIST/bmw/index.html" || fail "bmw third-party loader"
        test -f "$DIST/audi/index.html" || fail "missing audi/index.html"
        grep -q 'Аренда Audi без водителя в Москве' "$DIST/audi/index.html" || fail "audi h1 text"
        grep -q 'callibri.js' "$DIST/audi/index.html" || fail "audi Callibri"
        test -f "$DIST/search/bmw/index.html" || fail "missing search/bmw"
        grep -q 'canonical' "$DIST/search/bmw/index.html" || fail "search/bmw canonical"
        test -f "$DIST/moskva/search/index.html" || fail "missing moskva/search"
        grep -q 'drivebit-page-headline' "$DIST/moskva/search/index.html" || fail "moskva/search headline"
        grep -q 'Поиск автомобилей для аренды в Москве' "$DIST/moskva/search/index.html" || fail "moskva/search h1 text"
        grep -q 'callibri.js' "$DIST/moskva/search/index.html" || fail "moskva/search Callibri"
        grep -q 'drivebit-third-party-deferred' "$DIST/moskva/search/index.html" || fail "moskva/search third-party"
        test -f "$DIST/kaliningrad/search/index.html" || fail "kaliningrad/search"
        test -f "$DIST/krasnogorsk/search/index.html" || fail "krasnogorsk/search"
        test -f "$DIST/lyubertsy/search/index.html" || fail "lyubertsy/search"
        test -f "$DIST/zelenograd/search/index.html" || fail "zelenograd/search"
        test -f "$DIST/rostov-na-donu/index.html" || fail "rostov index"
        test -f "$DIST/rostov-na-donu/search/index.html" || fail "rostov/search"
        grep -q 'Поиск автомобилей для аренды в Ростове-на-Дону' "$DIST/rostov-na-donu/search/index.html" || fail "rostov/search h1"
        test -f "$DIST/search/index.html" || fail "search/index"
        grep -q 'moskva/search' "$DIST/search/index.html" || fail "search redirect"
        echo "Search brand SEO pages OK"
        test -f "$DIST/contacts/index.html" || fail "contacts"
        grep -q 'drivebit-contacts-page' "$DIST/contacts/index.html" || fail "contacts marker"
        grep -q 'callibri.js' "$DIST/contacts/index.html" || fail "contacts Callibri"
        echo "Contacts static page OK"

    - name: Show built index.html title
      run: |
        echo "Built index.html header preview:" && \
        head -n 15 composeApp/build/dist/js/productionExecutable/index.html | sed -n '1,15p'

    - name: Copy our custom index.html over generated one
      run: |
        echo "📄 Copying our custom index.html over generated one..."
        if [ ! -f "index.html" ]; then
          echo "❌ index.html not found in root directory!"
          exit 1
        fi
        cp index.html composeApp/build/dist/js/productionExecutable/index.html
        echo "✅ Custom index.html copied successfully"
        echo "📄 Custom index.html header preview:"
        head -n 15 composeApp/build/dist/js/productionExecutable/index.html | sed -n '1,15p'
        
        echo "📁 Checking what's in build output:"
        ls -la composeApp/build/dist/js/productionExecutable/ | head -20

    - name: Add cache-busting version to JS files
      run: |
        echo "🔄 Adding cache-busting version to JS files..."
        TIMESTAMP=$(date +%s)
        echo "Timestamp: $TIMESTAMP"
        
        # Update composeApp.js version in index.html (preload and script)
        sed -i "s/composeApp\.js?v=[0-9]*/composeApp.js?v=$TIMESTAMP/g" composeApp/build/dist/js/productionExecutable/index.html

        # Update carDetail.js version in car-detail shells
        sed -i "s/carDetail\.js?v=[0-9]*/carDetail.js?v=$TIMESTAMP/g" composeApp/build/dist/js/productionExecutable/car-detail/index.html
        sed -i "s/carDetail\.js?v=[0-9]*/carDetail.js?v=$TIMESTAMP/g" composeApp/build/dist/js/productionExecutable/car-photos-gallery/index.html
        find composeApp/build/dist/js/productionExecutable -name index.html -print0 | \
          xargs -0 grep -l 'myCars\.js' | \
          xargs -r sed -i "s/myCars\.js?v=[0-9]*/myCars.js?v=$TIMESTAMP/g"
        find composeApp/build/dist/js/productionExecutable -name index.html -print0 | \
          xargs -0 grep -l 'chats\.js' | \
          xargs -r sed -i "s/chats\.js?v=[0-9]*/chats.js?v=$TIMESTAMP/g"
        find composeApp/build/dist/js/productionExecutable -name index.html -print0 | \
          xargs -0 grep -l 'auth\.js' | \
          xargs -r sed -i "s/auth\.js?v=[0-9]*/auth.js?v=$TIMESTAMP/g"
        find composeApp/build/dist/js/productionExecutable -name index.html -print0 | \
          xargs -0 grep -l 'account\.js' | \
          xargs -r sed -i "s/account\.js?v=[0-9]*/account.js?v=$TIMESTAMP/g"
        
        # Rename JS files with timestamp
        cd composeApp/build/dist/js/productionExecutable
        if [ -f "composeApp.js" ]; then
          mv composeApp.js composeApp.js.orig
          cp composeApp.js.orig composeApp.js
        fi
        
        echo "✅ Cache-busting version added"

    - name: Verify GitHub Secrets
      run: |
        echo "🔍 Verifying GitHub Secrets..."
        if [ -z "${{ secrets.SERVER_HOST }}" ]; then
          echo "❌ SERVER_HOST secret is not set!"
          echo "Please set SERVER_HOST in GitHub Secrets (Settings → Secrets and variables → Actions)"
          exit 1
        fi
        if [ -z "${{ secrets.SERVER_USER }}" ]; then
          echo "❌ SERVER_USER secret is not set!"
          echo "Please set SERVER_USER in GitHub Secrets"
          exit 1
        fi
        if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
          echo "❌ SERVER_SSH_KEY secret is not set!"
          echo "Please set SERVER_SSH_KEY in GitHub Secrets"
          exit 1
        fi
        echo "✅ All required secrets are set"
        echo "📋 SERVER_HOST: ${{ secrets.SERVER_HOST }}"
        echo "📋 SERVER_USER: ${{ secrets.SERVER_USER }}"
        echo "📋 SERVER_PORT: ${{ secrets.SERVER_PORT || '22 (default)' }}"

    - name: Test server connection
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🔍 Testing server connection..."
          echo "✅ Connected to server successfully!"
          echo "🖥️  Server info:"
          uname -a
          echo "📁 Current directory: $(pwd)"
          echo "👤 Current user: $(whoami)"
          echo "🔑 User ID: $(id)"

    - name: Prepare release directory (atomic deploy)
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          RELEASE_NAME="${{ github.run_id }}-${{ github.run_attempt }}"
          RELEASE_PATH="$DEPLOY_ROOT/releases/$RELEASE_NAME"
          echo "Preparing atomic release: $RELEASE_PATH"
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          $SUDO_CMD mkdir -p "$DEPLOY_ROOT/releases"
          $SUDO_CMD mkdir -p "$RELEASE_PATH"
          if [ ! -e "$DEPLOY_ROOT/current" ]; then
            $SUDO_CMD mkdir -p "$DEPLOY_ROOT/releases/placeholder"
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Deploy pending</title></head><body></body></html>' | $SUDO_CMD tee "$DEPLOY_ROOT/releases/placeholder/index.html" >/dev/null
            $SUDO_CMD ln -sfn releases/placeholder "$DEPLOY_ROOT/current"
          fi
          echo "Clearing nginx cache..."
          $SUDO_CMD rm -rf /var/cache/nginx/* 2>/dev/null || true
          $SUDO_CMD rm -rf /tmp/nginx* 2>/dev/null || true
          $SUDO_CMD chown -R "$USER:$USER" "$DEPLOY_ROOT/releases" "$RELEASE_PATH" 2>/dev/null || $SUDO_CMD chown -R "$(id -u):$(id -g)" "$DEPLOY_ROOT/releases" "$RELEASE_PATH"
          echo "Ready for upload to $RELEASE_PATH"

    - name: Verify files exist before copying
      run: |
        echo "🔍 Verifying files exist before copying..."
        if [ ! -d "composeApp/build/dist/js/productionExecutable" ]; then
          echo "❌ Build directory not found!"
          exit 1
        fi
        echo "✅ Build directory exists"
        echo "📁 Files in build output:"
        ls -la composeApp/build/dist/js/productionExecutable/ | head -20
        if [ ! -f "composeApp/build/dist/js/productionExecutable/index.html" ]; then
          echo "❌ index.html not found in build output!"
          exit 1
        fi
        echo "✅ index.html found in build output"

    - name: Copy files to server (upload built assets)
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "composeApp/build/dist/js/productionExecutable/*"
        target: "${{ env.DEPLOY_ROOT }}/releases/${{ github.run_id }}-${{ github.run_attempt }}"
        strip_components: 0
        overwrite: true

    - name: Copy custom index.html and list-your-car.html
      continue-on-error: true
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "index.html,list-your-car.html,send.php"
        target: "${{ env.DEPLOY_ROOT }}/releases/${{ github.run_id }}-${{ github.run_attempt }}"
        strip_components: 0
        overwrite: true

    - name: Fix file structure (move files to correct location)
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          RELEASE_NAME="${{ github.run_id }}-${{ github.run_attempt }}"
          R="$DEPLOY_ROOT/releases/$RELEASE_NAME"
          echo "Fixing file structure under $R"
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          
          echo "Structure before fixing:"
          find "$R" -maxdepth 3 -type f -name "index.html" 2>/dev/null || echo "No index.html found"
          
          if [ -d "$R/composeApp/build/dist/js/productionExecutable" ]; then
            echo "Moving files from nested structure..."
            for file in "$R/composeApp/build/dist/js/productionExecutable"/*; do
              if [ -f "$file" ]; then
                $SUDO_CMD mv "$file" "$R/" || echo "Failed to move $file"
              elif [ -d "$file" ]; then
                dirname=$(basename "$file")
                if [ -d "$R/$dirname" ]; then
                  $SUDO_CMD cp -r "$file"/* "$R/$dirname"/ || echo "Failed to copy $file"
                else
                  $SUDO_CMD mv "$file" "$R/" || echo "Failed to move $file"
                fi
              fi
            done
            $SUDO_CMD rm -rf "$R/composeApp"
            echo "Nested tree flattened"
          else
            echo "Files already at release root"
          fi
          
          ls -la "$R" | head -25
          
          if [ -f "$R/index.html" ]; then
            echo "index.html OK"
          elif [ -f "$R/composeApp/build/dist/js/productionExecutable/index.html" ]; then
            $SUDO_CMD cp "$R/composeApp/build/dist/js/productionExecutable/index.html" "$R/index.html"
          else
            echo "index.html missing in $R"
            find "$R" -name "index.html" 2>/dev/null || true
            exit 1
          fi
          
          if [ -d "$R/images" ]; then
            echo "images: $(find "$R/images" -type f | wc -l) files"
          elif [ -d "$R/resources" ]; then
            echo "resources present"
          else
            echo "Optional: no images/resources dir"
          fi
          ls -la "$R" | head -20

    - name: Set file permissions
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          RELEASE_NAME="${{ github.run_id }}-${{ github.run_attempt }}"
          R="$DEPLOY_ROOT/releases/$RELEASE_NAME"
          echo "chmod/chown on $R"
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          $SUDO_CMD chown -R "$USER:$USER" "$R" 2>/dev/null || $SUDO_CMD chown -R "$(id -u):$(id -g)" "$R"
          $SUDO_CMD chmod -R u=rwX,go=rX "$R"
          ls -la "$R" | head -20

    - name: Activate release (symlink + prune + nginx reload)
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          RELEASE_NAME="${{ github.run_id }}-${{ github.run_attempt }}"
          KEEP=5
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          test -d "$DEPLOY_ROOT/releases/$RELEASE_NAME" || (echo "Missing release dir" && exit 1)
          test -f "$DEPLOY_ROOT/releases/$RELEASE_NAME/index.html" || (echo "Missing index.html" && exit 1)
          cd "$DEPLOY_ROOT"
          $SUDO_CMD ln -sfn "releases/$RELEASE_NAME" current
          CURRENT_REAL=$($SUDO_CMD readlink -f "$DEPLOY_ROOT/current")
          echo "Active release: $CURRENT_REAL"
          if [ -d "$DEPLOY_ROOT/releases" ]; then
            count=0
            for d in $($SUDO_CMD ls -1t "$DEPLOY_ROOT/releases" 2>/dev/null); do
              [ -d "$DEPLOY_ROOT/releases/$d" ] || continue
              full="$DEPLOY_ROOT/releases/$d"
              real=$($SUDO_CMD readlink -f "$full" 2>/dev/null || true)
              [ "$real" = "$CURRENT_REAL" ] && continue
              count=$((count + 1))
              if [ "$count" -gt "$KEEP" ]; then
                echo "Removing old release: $full"
                $SUDO_CMD rm -rf "$full"
              fi
            done
          fi
          NGINX_BIN=""
          for p in "$(command -v nginx 2>/dev/null || true)" /usr/sbin/nginx /usr/local/sbin/nginx /usr/local/nginx/sbin/nginx; do
            [ -z "$p" ] && continue
            if [ -f "$p" ]; then NGINX_BIN="$p"; break; fi
          done
          if [ -z "$NGINX_BIN" ]; then echo "nginx binary not found (install nginx or set path)"; exit 1; fi
          $SUDO_CMD "$NGINX_BIN" -t
          $SUDO_CMD systemctl reload nginx
          echo "Activated releases/$RELEASE_NAME"

    - name: Configure nginx API proxy
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          
          echo "🔍 Finding nginx configuration file..."
          NGINX_CONFIG=""
          if [ -f "/etc/nginx/sites-available/drivebit.ru" ]; then
            NGINX_CONFIG="/etc/nginx/sites-available/drivebit.ru"
          elif [ -f "/etc/nginx/sites-available/drivebit.my" ]; then
            NGINX_CONFIG="/etc/nginx/sites-available/drivebit.my"
          elif [ -f "/etc/nginx/sites-available/drivebit-clients" ]; then
            NGINX_CONFIG="/etc/nginx/sites-available/drivebit-clients"
          elif [ -f "/etc/nginx/conf.d/drivebit.conf" ]; then
            NGINX_CONFIG="/etc/nginx/conf.d/drivebit.conf"
          else
            echo "⚠️  Nginx config not found in common locations, checking all..."
            $SUDO_CMD find /etc/nginx -name "*drivebit*" -o -name "*default*" 2>/dev/null | head -5
            exit 1
          fi
          
          echo "📝 Using nginx config: $NGINX_CONFIG"
          
          # Backup config
          $SUDO_CMD cp "$NGINX_CONFIG" "${NGINX_CONFIG}.backup.$(date +%Y%m%d_%H%M%S)"
          
          # Check if API proxy already exists
          if grep -q 'location = /' "$NGINX_CONFIG" && grep -q 'return 301.*moskva' "$NGINX_CONFIG"; then
            echo "✅ SEO root redirect / → /moskva already exists"
          else
            echo "⚙️  Adding SEO root redirect (location = / → /moskva)..."
            TEMP_ROOT=$(mktemp)
            printf '    # SEO: canonical home URL (avoid duplicate / vs /moskva)\n    location = / {\n        return 301 https://drivebit.ru/moskva;\n    }\n' > "$TEMP_ROOT"
            $SUDO_CMD sed -i "/^[[:space:]]*location \/[[:space:]]*{/r $TEMP_ROOT" "$NGINX_CONFIG"
            rm -f "$TEMP_ROOT"
            echo "✅ SEO root redirect added"
          fi

          if grep -q "location /api/" "$NGINX_CONFIG"; then
            echo "✅ API proxy configuration already exists"
          else
            echo "⚙️  Adding API proxy configuration..."
            # Create temporary file with API proxy config using printf
            TEMP_CONFIG=$(mktemp)
            printf '    # API proxy to backend\n    location /api/ {\n        proxy_pass http://157.22.252.70:5000/;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        add_header Access-Control-Allow-Origin * always;\n        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;\n        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;\n        if ($request_method = OPTIONS) {\n            return 204;\n        }\n    }\n' > "$TEMP_CONFIG"
            # Insert before location / using sed with file read
            $SUDO_CMD sed -i "/^[[:space:]]*location \/[[:space:]]*{/r $TEMP_CONFIG" "$NGINX_CONFIG"
            rm -f "$TEMP_CONFIG"
            echo "✅ API proxy configuration added"
          fi
          
          # Test nginx config
          echo "🧪 Testing nginx configuration..."
          NGINX_BIN=""
          for p in "$(command -v nginx 2>/dev/null || true)" /usr/sbin/nginx /usr/local/sbin/nginx /usr/local/nginx/sbin/nginx; do
            [ -z "$p" ] && continue
            if [ -f "$p" ]; then NGINX_BIN="$p"; break; fi
          done
          if [ -z "$NGINX_BIN" ]; then echo "nginx binary not found"; exit 1; fi
          $SUDO_CMD "$NGINX_BIN" -t || (echo "❌ Nginx config test failed!" && exit 1)
          
          # Reload nginx
          echo "🔄 Reloading nginx..."
          $SUDO_CMD systemctl reload nginx || $SUDO_CMD systemctl restart nginx
          echo "✅ Nginx reloaded with API proxy configuration"

    - name: Configure nginx images noindex
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          NGINX_CONFIG=""
          for p in /etc/nginx/sites-available/drivebit.ru /etc/nginx/sites-available/drivebit.my \
              /etc/nginx/sites-available/drivebit-clients /etc/nginx/conf.d/drivebit.conf; do
            if [ -f "$p" ]; then NGINX_CONFIG="$p"; break; fi
          done
          if [ -z "$NGINX_CONFIG" ]; then echo "nginx config not found"; exit 0; fi
          if grep -q 'location \^~ /images/' "$NGINX_CONFIG"; then
            echo "images noindex location already configured"
            exit 0
          fi
          $SUDO_CMD cp "$NGINX_CONFIG" "${NGINX_CONFIG}.backup.images-noindex.$(date +%Y%m%d_%H%M%S)"
          TEMP_CONFIG=$(mktemp)
          printf '    # SEO: do not index static images; never SPA-fallback to index.html\n    location ^~ /images/ {\n        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;\n        try_files $uri =404;\n    }\n' > "$TEMP_CONFIG"
          $SUDO_CMD sed -i "/^[[:space:]]*location \/[[:space:]]*{/r $TEMP_CONFIG" "$NGINX_CONFIG"
          rm -f "$TEMP_CONFIG"
          NGINX_BIN=""
          for p in "$(command -v nginx 2>/dev/null || true)" /usr/sbin/nginx /usr/local/sbin/nginx /usr/local/nginx/sbin/nginx; do
            [ -z "$p" ] && continue
            if [ -f "$p" ]; then NGINX_BIN="$p"; break; fi
          done
          if [ -z "$NGINX_BIN" ]; then echo "nginx binary not found"; exit 1; fi
          $SUDO_CMD "$NGINX_BIN" -t
          $SUDO_CMD systemctl reload nginx
          echo "Configured ^~ /images/ in $NGINX_CONFIG"

    - name: Enable nginx static compression (gzip_static, wasm type)
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          CFG="/etc/nginx/conf.d/drivebit_static.conf"
          echo "⚙️  Ensuring nginx static compression settings in $CFG"
          $SUDO_CMD bash -lc "cat > $CFG <<'CONF'\n# drivebit static compression\ngzip_static on;\n# ensure wasm MIME present (in case not in mime.types)\ntypes { application/wasm wasm; }\nCONF"
          
          # Force nginx to reload and clear caches
          echo "🔄 Forcing nginx reload and cache clear..."
          NGINX_BIN=""
          for p in "$(command -v nginx 2>/dev/null || true)" /usr/sbin/nginx /usr/local/sbin/nginx /usr/local/nginx/sbin/nginx; do
            [ -z "$p" ] && continue
            if [ -f "$p" ]; then NGINX_BIN="$p"; break; fi
          done
          if [ -z "$NGINX_BIN" ]; then echo "nginx binary not found"; exit 1; fi
          $SUDO_CMD "$NGINX_BIN" -t
          $SUDO_CMD systemctl reload nginx
          echo "Nginx reloaded (static compression conf)"

    - name: Ensure leads.log for send.php
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          $SUDO_CMD touch "$DEPLOY_ROOT/leads.log"
          $SUDO_CMD chown www-data:www-data "$DEPLOY_ROOT/leads.log" 2>/dev/null || $SUDO_CMD chown nginx:nginx "$DEPLOY_ROOT/leads.log" 2>/dev/null || true
          $SUDO_CMD chmod 664 "$DEPLOY_ROOT/leads.log"
          test -f "$DEPLOY_ROOT/current/send.php" && echo "send.php present in active release" || echo "send.php not in release yet"

    - name: Configure nginx send.php handler
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          NGINX_CONFIG=""
          for p in /etc/nginx/sites-available/drivebit.ru /etc/nginx/sites-available/drivebit.my /etc/nginx/sites-available/drivebit-clients /etc/nginx/conf.d/drivebit.conf; do
            if [ -f "$p" ]; then NGINX_CONFIG="$p"; break; fi
          done
          if [ -z "$NGINX_CONFIG" ]; then echo "nginx config not found"; exit 0; fi
          if grep -q 'location = /send.php' "$NGINX_CONFIG"; then
            echo "send.php location already configured"
            exit 0
          fi
          PHP_SOCK=""
          for s in /run/php/php8.3-fpm.sock /run/php/php8.2-fpm.sock /run/php/php8.1-fpm.sock /var/run/php/php-fpm.sock; do
            if [ -S "$s" ]; then PHP_SOCK="$s"; break; fi
          done
          if [ -z "$PHP_SOCK" ]; then
            echo "PHP-FPM not installed — run: apt-get install -y php-fpm php-mbstring postfix"
            exit 0
          fi
          $SUDO_CMD cp "$NGINX_CONFIG" "${NGINX_CONFIG}.backup.send-php.$(date +%Y%m%d_%H%M%S)"
          TEMP=$(mktemp)
          printf '    location = /send.php {\n        include fastcgi_params;\n        fastcgi_param SCRIPT_FILENAME $document_root/send.php;\n        fastcgi_pass unix:%s;\n    }\n\n' "$PHP_SOCK" > "$TEMP"
          $SUDO_CMD sed -i "/^[[:space:]]*location \\/[[:space:]]*{/r $TEMP" "$NGINX_CONFIG"
          rm -f "$TEMP"
          NGINX_BIN=""
          for p in "$(command -v nginx 2>/dev/null || true)" /usr/sbin/nginx; do
            [ -f "$p" ] && NGINX_BIN="$p" && break
          done
          $SUDO_CMD "$NGINX_BIN" -t
          $SUDO_CMD systemctl reload nginx
          echo "Configured location = /send.php with $PHP_SOCK"

    - name: Verify deployed page title
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          test -f "$DEPLOY_ROOT/current/index.html" || (echo "index.html missing under current" && exit 1)
          echo "Page title from active release:"
          grep -o '<title>[^<]*' -m1 "$DEPLOY_ROOT/current/index.html" || true
          readlink -f "$DEPLOY_ROOT/current" || true

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Fast web version deployed successfully!"
        echo "📁 Active symlink: ${{ env.DEPLOY_ROOT }}/current → releases/${{ github.run_id }}-${{ github.run_attempt }}"
        echo "🌐 Fast web app is now live at: http://${{ secrets.SERVER_DOMAIN || secrets.SERVER_HOST }}/"
        echo "🚀 Loads 10x faster than WASM version!"
        echo "🔧 Nginx configured and serving the application"

    - name: Debug deployment state
      if: failure()
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          DR="${{ env.DEPLOY_ROOT }}"
          echo "Debugging atomic deploy..."
          ls -la "$DR" || true
          echo "current ->"; readlink "$DR/current" || true
          echo "current resolved:"; readlink -f "$DR/current" || true
          echo "releases:"; ls -la "$DR/releases" || true
          R="$DR/releases/${{ github.run_id }}-${{ github.run_attempt }}"
          echo "This run release dir $R:"; ls -la "$R" 2>/dev/null || true
          test -f "$DR/current/index.html" && echo "current/index.html ok" || echo "current/index.html missing"

    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."
        echo ""
        echo "Common issues:"
        echo "1. SSH connection failed - check SERVER_SSH_KEY secret"
        echo "2. index.html not found - check if file was copied"
        echo "3. Images directory missing - might be OK if images are in resources"
        echo "4. Permission denied - check SERVER_USER permissions"
