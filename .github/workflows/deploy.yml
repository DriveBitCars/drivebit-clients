name: Deploy

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules/
          **/node_modules/
        key: node-modules-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
        restore-keys: |
          node-modules-

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
        key: deploy-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          deploy-gradle-
          gradle-

    - name: Cache build outputs
      uses: actions/cache@v4
      with:
        path: |
          build/
          .gradle/
          ~/.gradle/build-cache/
        key: deploy-build-${{ hashFiles('**/*.kt', '**/*.gradle*') }}
        restore-keys: |
          deploy-build-
          build-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Clean build cache
      run: ./gradlew clean --no-daemon

    - name: Build JS distribution (fast web version)
      run: ./gradlew :composeApp:jsBrowserDistribution --no-daemon

    - name: Show built index.html title
      run: |
        echo "Built index.html header preview:" && \
        head -n 15 composeApp/build/dist/js/productionExecutable/index.html | sed -n '1,15p'

    - name: Copy our custom index.html over generated one
      run: |
        echo "📄 Copying our custom index.html over generated one..."
        if [ ! -f "index.html" ]; then
          echo "❌ index.html not found in root directory!"
          exit 1
        fi
        cp index.html composeApp/build/dist/js/productionExecutable/index.html
        echo "✅ Custom index.html copied successfully"
        echo "📄 Custom index.html header preview:"
        head -n 15 composeApp/build/dist/js/productionExecutable/index.html | sed -n '1,15p'
        
        echo "📁 Checking what's in build output:"
        ls -la composeApp/build/dist/js/productionExecutable/ | head -20

    - name: Add cache-busting version to JS files
      run: |
        echo "🔄 Adding cache-busting version to JS files..."
        TIMESTAMP=$(date +%s)
        echo "Timestamp: $TIMESTAMP"
        
        # Update composeApp.js version in index.html (preload and script)
        sed -i "s/composeApp\.js?v=[0-9]*/composeApp.js?v=$TIMESTAMP/g" composeApp/build/dist/js/productionExecutable/index.html
        
        # Rename JS files with timestamp
        cd composeApp/build/dist/js/productionExecutable
        if [ -f "composeApp.js" ]; then
          mv composeApp.js composeApp.js.orig
          cp composeApp.js.orig composeApp.js
        fi
        
        echo "✅ Cache-busting version added"

    - name: Generate prerender-bot.html, car pages, sitemap.xml and sitemap-ru.xml
      run: |
        OUT=composeApp/build/dist/js/productionExecutable
        OUTPUT_PATH=$OUT/prerender-bot.html \
        SITEMAP_FILENAME=sitemap.xml \
        SITEMAP_MIRROR=sitemap-ru.xml \
        SITE_BASE=https://drivebit.ru \
        node scripts/generate-prerender-bot.js
        ls -la "$OUT/prerender-bot.html" "$OUT/sitemap.xml" "$OUT/sitemap-ru.xml"

    - name: Verify GitHub Secrets
      run: |
        echo "🔍 Verifying GitHub Secrets..."
        if [ -z "${{ secrets.SERVER_HOST }}" ]; then
          echo "❌ SERVER_HOST secret is not set!"
          echo "Please set SERVER_HOST in GitHub Secrets (Settings → Secrets and variables → Actions)"
          exit 1
        fi
        if [ -z "${{ secrets.SERVER_USER }}" ]; then
          echo "❌ SERVER_USER secret is not set!"
          echo "Please set SERVER_USER in GitHub Secrets"
          exit 1
        fi
        if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
          echo "❌ SERVER_SSH_KEY secret is not set!"
          echo "Please set SERVER_SSH_KEY in GitHub Secrets"
          exit 1
        fi
        echo "✅ All required secrets are set"
        echo "📋 SERVER_HOST: ${{ secrets.SERVER_HOST }}"
        echo "📋 SERVER_USER: ${{ secrets.SERVER_USER }}"
        echo "📋 SERVER_PORT: ${{ secrets.SERVER_PORT || '22 (default)' }}"

    - name: Test server connection
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🔍 Testing server connection..."
          echo "✅ Connected to server successfully!"
          echo "🖥️  Server info:"
          uname -a
          echo "📁 Current directory: $(pwd)"
          echo "👤 Current user: $(whoami)"
          echo "🔑 User ID: $(id)"

    - name: Prepare deployment directory (clean target)
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e  # Exit on any error
          echo "🚀 Preparing deployment directory..."
          
          # Check if running as root or with sudo
          if [ "$EUID" -ne 0 ]; then
            echo "⚠️  Not running as root, using sudo for system commands"
            SUDO_CMD="sudo"
          else
            echo "✅ Running as root"
            SUDO_CMD=""
          fi
          
          # Clear nginx cache
          echo "🧹 Clearing nginx cache..."
          $SUDO_CMD rm -rf /var/cache/nginx/* 2>/dev/null || true
          $SUDO_CMD rm -rf /tmp/nginx* 2>/dev/null || true
          echo "✅ Nginx cache cleared"
          
          # Create backup of current deployment
          if [ -d "/var/www/drivebit-clients" ]; then
            echo "💾 Creating backup of current deployment..."
            $SUDO_CMD cp -r /var/www/drivebit-clients /var/www/drivebit-clients.backup.$(date +%Y%m%d_%H%M%S)
            echo "✅ Backup created successfully"
            echo "🧹 Cleaning current deployment contents..."
            $SUDO_CMD rm -rf /var/www/drivebit-clients/*
            echo "✅ Cleaned"
          else
            echo "ℹ️  No existing deployment found, skipping backup"
          fi
          
          # Create deployment directory if it doesn't exist
          echo "📁 Creating deployment directory..."
          $SUDO_CMD mkdir -p /var/www/drivebit-clients
          $SUDO_CMD chown -R $USER:$USER /var/www/drivebit-clients
          echo "✅ Deployment directory prepared"

    - name: Verify files exist before copying
      run: |
        echo "🔍 Verifying files exist before copying..."
        if [ ! -d "composeApp/build/dist/js/productionExecutable" ]; then
          echo "❌ Build directory not found!"
          exit 1
        fi
        echo "✅ Build directory exists"
        echo "📁 Files in build output:"
        ls -la composeApp/build/dist/js/productionExecutable/ | head -20
        if [ ! -f "composeApp/build/dist/js/productionExecutable/index.html" ]; then
          echo "❌ index.html not found in build output!"
          exit 1
        fi
        echo "✅ index.html found in build output"

    - name: Copy files to server (upload built assets)
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "composeApp/build/dist/js/productionExecutable/*"
        target: "/var/www/drivebit-clients"
        strip_components: 0
        overwrite: true

    - name: Copy car detail pages
      continue-on-error: true
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "composeApp/build/dist/js/productionExecutable/car"
        target: "/var/www/drivebit-clients"
        strip_components: 0
        overwrite: true

    - name: Copy custom index.html and list-your-car.html
      continue-on-error: true
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "index.html,list-your-car.html"
        target: "/var/www/drivebit-clients"
        strip_components: 0
        overwrite: true

    - name: Fix file structure (move files to correct location)
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          echo "🔧 Fixing file structure..."
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          
          echo "📁 Current structure before fixing:"
          find /var/www/drivebit-clients -maxdepth 3 -type f -name "index.html" 2>/dev/null || echo "No index.html found"
          find /var/www/drivebit-clients -maxdepth 3 -type d 2>/dev/null | head -10
          
          # Move files from nested structure to root if needed
          if [ -d "/var/www/drivebit-clients/composeApp/build/dist/js/productionExecutable" ]; then
            echo "📁 Moving files from nested structure..."
            # Move files one by one to handle existing directories
            for file in /var/www/drivebit-clients/composeApp/build/dist/js/productionExecutable/*; do
              if [ -f "$file" ]; then
                $SUDO_CMD mv "$file" /var/www/drivebit-clients/ || echo "⚠️  Failed to move $file"
              elif [ -d "$file" ]; then
                # For directories, merge contents
                dirname=$(basename "$file")
                if [ -d "/var/www/drivebit-clients/$dirname" ]; then
                  $SUDO_CMD cp -r "$file"/* /var/www/drivebit-clients/"$dirname"/ || echo "⚠️  Failed to copy $file"
                else
                  $SUDO_CMD mv "$file" /var/www/drivebit-clients/ || echo "⚠️  Failed to move $file"
                fi
              fi
            done
            $SUDO_CMD rm -rf /var/www/drivebit-clients/composeApp
            echo "✅ Files moved to correct location"
          else
            echo "ℹ️  Files already in correct location"
          fi
          
          echo "📁 Structure after fixing:"
          ls -la /var/www/drivebit-clients/ | head -20
          
          # Verify index.html exists - check multiple possible locations
          if [ -f "/var/www/drivebit-clients/index.html" ]; then
            echo "✅ index.html found in correct location"
          elif [ -f "/var/www/drivebit-clients/composeApp/build/dist/js/productionExecutable/index.html" ]; then
            echo "⚠️  index.html found in nested location, moving..."
            $SUDO_CMD cp /var/www/drivebit-clients/composeApp/build/dist/js/productionExecutable/index.html /var/www/drivebit-clients/index.html
            echo "✅ index.html moved to correct location"
          else
            echo "❌ index.html not found in any location!"
            echo "🔍 Searching for index.html:"
            find /var/www/drivebit-clients -name "index.html" 2>/dev/null || echo "No index.html found anywhere"
            exit 1
          fi
          
          # Verify images directory exists (optional - images might be in resources)
          if [ -d "/var/www/drivebit-clients/images" ]; then
            echo "✅ images directory found"
            echo "📸 Image files count: $(find /var/www/drivebit-clients/images -type f | wc -l)"
          else
            echo "⚠️  images directory not found (checking if images are in resources)..."
            if [ -d "/var/www/drivebit-clients/resources" ]; then
              echo "✅ resources directory found (images might be here)"
            else
              echo "⚠️  Neither images nor resources directory found, but continuing..."
            fi
          fi
          
          # List all directories to help debug
          echo "📁 All directories in deployment:"
          ls -la /var/www/drivebit-clients/ | head -20
          

    - name: Set file permissions
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e  # Exit on any error
          echo "🔐 Setting file permissions..."
          
          # Check if running as root or with sudo
          if [ "$EUID" -ne 0 ]; then
            echo "⚠️  Not running as root, using sudo for system commands"
            SUDO_CMD="sudo"
          else
            echo "✅ Running as root"
            SUDO_CMD=""
          fi
          
          # Set proper permissions
          echo "📋 Setting file permissions..."
          $SUDO_CMD chown -R $USER:$USER /var/www/drivebit-clients
          $SUDO_CMD chmod -R 755 /var/www/drivebit-clients
          echo "✅ Permissions set successfully"
          
          # List deployed files
          echo "📁 Deployed files:"
          ls -la /var/www/drivebit-clients/
          echo "✅ Deployment completed successfully!"

    - name: Configure nginx API proxy
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          
          echo "🔍 Finding nginx configuration file..."
          NGINX_CONFIG=""
          if [ -f "/etc/nginx/sites-available/drivebit.ru" ]; then
            NGINX_CONFIG="/etc/nginx/sites-available/drivebit.ru"
          elif [ -f "/etc/nginx/sites-available/drivebit.my" ]; then
            NGINX_CONFIG="/etc/nginx/sites-available/drivebit.my"
          elif [ -f "/etc/nginx/sites-available/drivebit-clients" ]; then
            NGINX_CONFIG="/etc/nginx/sites-available/drivebit-clients"
          elif [ -f "/etc/nginx/conf.d/drivebit.conf" ]; then
            NGINX_CONFIG="/etc/nginx/conf.d/drivebit.conf"
          else
            echo "⚠️  Nginx config not found in common locations, checking all..."
            $SUDO_CMD find /etc/nginx -name "*drivebit*" -o -name "*default*" 2>/dev/null | head -5
            exit 1
          fi
          
          echo "📝 Using nginx config: $NGINX_CONFIG"
          
          # Backup config
          $SUDO_CMD cp "$NGINX_CONFIG" "${NGINX_CONFIG}.backup.$(date +%Y%m%d_%H%M%S)"
          
          # Check if API proxy already exists
          if grep -q "location /api/" "$NGINX_CONFIG"; then
            echo "✅ API proxy configuration already exists"
          else
            echo "⚙️  Adding API proxy configuration..."
            # Create temporary file with API proxy config using printf
            TEMP_CONFIG=$(mktemp)
            printf '    # API proxy to backend\n    location /api/ {\n        proxy_pass http://155.212.170.94:5000/;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        add_header Access-Control-Allow-Origin * always;\n        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;\n        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;\n        if ($request_method = OPTIONS) {\n            return 204;\n        }\n    }\n' > "$TEMP_CONFIG"
            # Insert before location / using sed with file read
            $SUDO_CMD sed -i "/^[[:space:]]*location \/[[:space:]]*{/r $TEMP_CONFIG" "$NGINX_CONFIG"
            rm -f "$TEMP_CONFIG"
            echo "✅ API proxy configuration added"
          fi
          
          # Test nginx config
          echo "🧪 Testing nginx configuration..."
          $SUDO_CMD nginx -t || (echo "❌ Nginx config test failed!" && exit 1)
          
          # Reload nginx
          echo "🔄 Reloading nginx..."
          $SUDO_CMD systemctl reload nginx || $SUDO_CMD systemctl restart nginx
          echo "✅ Nginx reloaded with API proxy configuration"

    - name: Enable nginx static compression (gzip_static, wasm type)
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          CFG="/etc/nginx/conf.d/drivebit_static.conf"
          echo "⚙️  Ensuring nginx static compression settings in $CFG"
          $SUDO_CMD bash -lc "cat > $CFG <<'CONF'\n# drivebit static compression\ngzip_static on;\n# ensure wasm MIME present (in case not in mime.types)\ntypes { application/wasm wasm; }\nCONF"
          
          # Force nginx to reload and clear caches
          echo "🔄 Forcing nginx reload and cache clear..."
          $SUDO_CMD nginx -t
          $SUDO_CMD systemctl reload nginx
          $SUDO_CMD systemctl restart nginx
          echo "✅ Nginx restarted with fresh cache"

    - name: Verify deployed page title
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          test -f /var/www/drivebit-clients/index.html || (echo "❌ index.html missing after upload" && exit 1)
          echo "📄 Page title from index.html:"
          grep -o '<title>[^<]*' -m1 /var/www/drivebit-clients/index.html || true

    - name: Copy warm-prerender script to server
      continue-on-error: true
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "scripts/warm-prerender-after-deploy.sh"
        target: "/tmp/"
        strip_components: 1

    - name: Copy warm-prerender-nightly script to server
      continue-on-error: true
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "scripts/warm-prerender-nightly.sh"
        target: "/tmp/"
        strip_components: 1

    - name: Persist prerender warm scripts under /opt/drivebit-scripts
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          if [ "${EUID:-$(id -u)}" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          $SUDO_CMD mkdir -p /opt/drivebit-scripts
          for name in warm-prerender-after-deploy.sh warm-prerender-nightly.sh; do
            src=""
            for p in "/tmp/$name" "/tmp/scripts/$name"; do
              if [ -f "$p" ]; then src="$p"; break; fi
            done
            if [ -z "$src" ]; then
              src=$(find /tmp -maxdepth 4 -name "$name" -type f 2>/dev/null | head -1)
            fi
            if [ -n "$src" ] && [ -f "$src" ]; then
              $SUDO_CMD cp "$src" "/opt/drivebit-scripts/$name"
              $SUDO_CMD chmod +x "/opt/drivebit-scripts/$name"
              echo "✅ Installed /opt/drivebit-scripts/$name"
            else
              echo "⚠️  $name not found under /tmp (skip persist)"
            fi
          done

    - name: Invalidate and warm Prerender cache
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          SCRIPT=""
          for p in /tmp/warm-prerender-after-deploy.sh /tmp/scripts/warm-prerender-after-deploy.sh; do
            if [ -f "$p" ]; then SCRIPT="$p"; break; fi
          done
          if [ -z "$SCRIPT" ]; then
            SCRIPT=$(find /tmp -maxdepth 4 -name 'warm-prerender-after-deploy.sh' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$SCRIPT" ] || [ ! -f "$SCRIPT" ]; then
            echo "❌ warm-prerender-after-deploy.sh not found under /tmp (check scp strip_components)"
            exit 1
          fi
          chmod +x "$SCRIPT"
          export SITE_URL="https://drivebit.ru"
          export PRERENDER_COMPOSE_DIR="/opt/drivebit-prerender"
          export PRERENDER_SERVICE="prerender"
          export CURL_MAX_TIME="300"
          "$SCRIPT"

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Fast web version deployed successfully!"
        echo "📁 Files deployed to: /var/www/drivebit-clients/"
        echo "🌐 Fast web app is now live at: http://${{ secrets.SERVER_DOMAIN || secrets.SERVER_HOST }}/"
        echo "🚀 Loads 10x faster than WASM version!"
        echo "🔧 Nginx configured and serving the application"

    - name: Debug deployment state
      if: failure()
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🔍 Debugging deployment state..."
          echo "📁 Contents of /var/www/drivebit-clients:"
          ls -la /var/www/drivebit-clients/ || echo "Directory does not exist"
          echo ""
          echo "📄 Checking for index.html:"
          test -f /var/www/drivebit-clients/index.html && echo "✅ index.html exists" || echo "❌ index.html missing"
          echo ""
          echo "📁 Checking for images:"
          test -d /var/www/drivebit-clients/images && echo "✅ images directory exists" || echo "⚠️  images directory missing"
          echo ""
          echo "📁 Checking for resources:"
          test -d /var/www/drivebit-clients/resources && echo "✅ resources directory exists" || echo "⚠️  resources directory missing"

    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."
        echo ""
        echo "Common issues:"
        echo "1. SSH connection failed - check SERVER_SSH_KEY secret"
        echo "2. index.html not found - check if file was copied"
        echo "3. Images directory missing - might be OK if images are in resources"
        echo "4. Permission denied - check SERVER_USER permissions"
