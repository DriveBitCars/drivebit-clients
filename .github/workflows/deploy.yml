name: Deploy

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy web (atomic)
    runs-on: ubuntu-latest
    env:
      DEPLOY_ROOT: /var/www/drivebit-clients

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules/
          **/node_modules/
        key: node-modules-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
        restore-keys: |
          node-modules-

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
        key: deploy-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          deploy-gradle-
          gradle-

    - name: Cache build outputs
      uses: actions/cache@v4
      with:
        path: |
          build/
          .gradle/
          ~/.gradle/build-cache/
        key: deploy-build-${{ hashFiles('**/*.kt', '**/*.gradle*') }}
        restore-keys: |
          deploy-build-
          build-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Generate Moscow SEO snapshots
      run: DRIVEBIT_API_BASE=http://157.22.252.70:5000 python3 scripts/generate_moskva_seo.py

    - name: Generate search brand SEO pages
      run: DRIVEBIT_API_BASE=http://157.22.252.70:5000 python3 scripts/generate_search_brand_seo.py

    - name: Clean build cache
      run: ./gradlew clean --no-daemon

    - name: Build JS distribution (fast web version)
      run: ./gradlew :composeApp:jsBrowserDistribution --no-daemon

    - name: Verify Moscow SEO pages in dist
      run: |
        set -e
        DIST="composeApp/build/dist/js/productionExecutable"
        test -f "$DIST/moskva/poblizosti/index.html"
        grep -q 'ItemList' "$DIST/moskva/poblizosti/index.html"
        grep -q 'drivebit-seo-cars' "$DIST/moskva/poblizosti/index.html"
        grep -q 'drivebit-seo-nav' "$DIST/moskva/kanikuly/index.html"
        for slug in "" k-rodnym kanikuly komandirovki za-gorod pereezd meropriyatie poblizosti puteshestviya; do
          if [ -z "$slug" ]; then
            page="$DIST/moskva/index.html"
          else
            page="$DIST/moskva/$slug/index.html"
          fi
          test -f "$page"
          grep -q 'ItemList' "$page"
        done
        echo "Moscow SEO landing pages OK"
        test -f "$DIST/search/bmw/index.html"
        grep -q 'ItemList' "$DIST/search/bmw/index.html"
        grep -q 'drivebit-seo-text' "$DIST/search/bmw/index.html"
        echo "Search brand SEO pages OK"

    - name: Show built index.html title
      run: |
        echo "Built index.html header preview:" && \
        head -n 15 composeApp/build/dist/js/productionExecutable/index.html | sed -n '1,15p'

    - name: Copy our custom index.html over generated one
      run: |
        echo "📄 Copying our custom index.html over generated one..."
        if [ ! -f "index.html" ]; then
          echo "❌ index.html not found in root directory!"
          exit 1
        fi
        cp index.html composeApp/build/dist/js/productionExecutable/index.html
        echo "✅ Custom index.html copied successfully"
        echo "📄 Custom index.html header preview:"
        head -n 15 composeApp/build/dist/js/productionExecutable/index.html | sed -n '1,15p'
        
        echo "📁 Checking what's in build output:"
        ls -la composeApp/build/dist/js/productionExecutable/ | head -20

    - name: Add cache-busting version to JS files
      run: |
        echo "🔄 Adding cache-busting version to JS files..."
        TIMESTAMP=$(date +%s)
        echo "Timestamp: $TIMESTAMP"
        
        # Update composeApp.js version in index.html (preload and script)
        sed -i "s/composeApp\.js?v=[0-9]*/composeApp.js?v=$TIMESTAMP/g" composeApp/build/dist/js/productionExecutable/index.html
        
        # Rename JS files with timestamp
        cd composeApp/build/dist/js/productionExecutable
        if [ -f "composeApp.js" ]; then
          mv composeApp.js composeApp.js.orig
          cp composeApp.js.orig composeApp.js
        fi
        
        echo "✅ Cache-busting version added"

    - name: Verify GitHub Secrets
      run: |
        echo "🔍 Verifying GitHub Secrets..."
        if [ -z "${{ secrets.SERVER_HOST }}" ]; then
          echo "❌ SERVER_HOST secret is not set!"
          echo "Please set SERVER_HOST in GitHub Secrets (Settings → Secrets and variables → Actions)"
          exit 1
        fi
        if [ -z "${{ secrets.SERVER_USER }}" ]; then
          echo "❌ SERVER_USER secret is not set!"
          echo "Please set SERVER_USER in GitHub Secrets"
          exit 1
        fi
        if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
          echo "❌ SERVER_SSH_KEY secret is not set!"
          echo "Please set SERVER_SSH_KEY in GitHub Secrets"
          exit 1
        fi
        echo "✅ All required secrets are set"
        echo "📋 SERVER_HOST: ${{ secrets.SERVER_HOST }}"
        echo "📋 SERVER_USER: ${{ secrets.SERVER_USER }}"
        echo "📋 SERVER_PORT: ${{ secrets.SERVER_PORT || '22 (default)' }}"

    - name: Test server connection
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🔍 Testing server connection..."
          echo "✅ Connected to server successfully!"
          echo "🖥️  Server info:"
          uname -a
          echo "📁 Current directory: $(pwd)"
          echo "👤 Current user: $(whoami)"
          echo "🔑 User ID: $(id)"

    - name: Prepare release directory (atomic deploy)
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          RELEASE_NAME="${{ github.run_id }}-${{ github.run_attempt }}"
          RELEASE_PATH="$DEPLOY_ROOT/releases/$RELEASE_NAME"
          echo "Preparing atomic release: $RELEASE_PATH"
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          $SUDO_CMD mkdir -p "$DEPLOY_ROOT/releases"
          $SUDO_CMD mkdir -p "$RELEASE_PATH"
          if [ ! -e "$DEPLOY_ROOT/current" ]; then
            $SUDO_CMD mkdir -p "$DEPLOY_ROOT/releases/placeholder"
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Deploy pending</title></head><body></body></html>' | $SUDO_CMD tee "$DEPLOY_ROOT/releases/placeholder/index.html" >/dev/null
            $SUDO_CMD ln -sfn releases/placeholder "$DEPLOY_ROOT/current"
          fi
          echo "Clearing nginx cache..."
          $SUDO_CMD rm -rf /var/cache/nginx/* 2>/dev/null || true
          $SUDO_CMD rm -rf /tmp/nginx* 2>/dev/null || true
          $SUDO_CMD chown -R "$USER:$USER" "$DEPLOY_ROOT/releases" "$RELEASE_PATH" 2>/dev/null || $SUDO_CMD chown -R "$(id -u):$(id -g)" "$DEPLOY_ROOT/releases" "$RELEASE_PATH"
          echo "Ready for upload to $RELEASE_PATH"

    - name: Verify files exist before copying
      run: |
        echo "🔍 Verifying files exist before copying..."
        if [ ! -d "composeApp/build/dist/js/productionExecutable" ]; then
          echo "❌ Build directory not found!"
          exit 1
        fi
        echo "✅ Build directory exists"
        echo "📁 Files in build output:"
        ls -la composeApp/build/dist/js/productionExecutable/ | head -20
        if [ ! -f "composeApp/build/dist/js/productionExecutable/index.html" ]; then
          echo "❌ index.html not found in build output!"
          exit 1
        fi
        echo "✅ index.html found in build output"

    - name: Copy files to server (upload built assets)
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "composeApp/build/dist/js/productionExecutable/*"
        target: "${{ env.DEPLOY_ROOT }}/releases/${{ github.run_id }}-${{ github.run_attempt }}"
        strip_components: 0
        overwrite: true

    - name: Copy custom index.html and list-your-car.html
      continue-on-error: true
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "index.html,list-your-car.html"
        target: "${{ env.DEPLOY_ROOT }}/releases/${{ github.run_id }}-${{ github.run_attempt }}"
        strip_components: 0
        overwrite: true

    - name: Fix file structure (move files to correct location)
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          RELEASE_NAME="${{ github.run_id }}-${{ github.run_attempt }}"
          R="$DEPLOY_ROOT/releases/$RELEASE_NAME"
          echo "Fixing file structure under $R"
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          
          echo "Structure before fixing:"
          find "$R" -maxdepth 3 -type f -name "index.html" 2>/dev/null || echo "No index.html found"
          
          if [ -d "$R/composeApp/build/dist/js/productionExecutable" ]; then
            echo "Moving files from nested structure..."
            for file in "$R/composeApp/build/dist/js/productionExecutable"/*; do
              if [ -f "$file" ]; then
                $SUDO_CMD mv "$file" "$R/" || echo "Failed to move $file"
              elif [ -d "$file" ]; then
                dirname=$(basename "$file")
                if [ -d "$R/$dirname" ]; then
                  $SUDO_CMD cp -r "$file"/* "$R/$dirname"/ || echo "Failed to copy $file"
                else
                  $SUDO_CMD mv "$file" "$R/" || echo "Failed to move $file"
                fi
              fi
            done
            $SUDO_CMD rm -rf "$R/composeApp"
            echo "Nested tree flattened"
          else
            echo "Files already at release root"
          fi
          
          ls -la "$R" | head -25
          
          if [ -f "$R/index.html" ]; then
            echo "index.html OK"
          elif [ -f "$R/composeApp/build/dist/js/productionExecutable/index.html" ]; then
            $SUDO_CMD cp "$R/composeApp/build/dist/js/productionExecutable/index.html" "$R/index.html"
          else
            echo "index.html missing in $R"
            find "$R" -name "index.html" 2>/dev/null || true
            exit 1
          fi
          
          if [ -d "$R/images" ]; then
            echo "images: $(find "$R/images" -type f | wc -l) files"
          elif [ -d "$R/resources" ]; then
            echo "resources present"
          else
            echo "Optional: no images/resources dir"
          fi
          ls -la "$R" | head -20

    - name: Set file permissions
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          RELEASE_NAME="${{ github.run_id }}-${{ github.run_attempt }}"
          R="$DEPLOY_ROOT/releases/$RELEASE_NAME"
          echo "chmod/chown on $R"
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          $SUDO_CMD chown -R "$USER:$USER" "$R" 2>/dev/null || $SUDO_CMD chown -R "$(id -u):$(id -g)" "$R"
          $SUDO_CMD chmod -R u=rwX,go=rX "$R"
          ls -la "$R" | head -20

    - name: Activate release (symlink + prune + nginx reload)
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          RELEASE_NAME="${{ github.run_id }}-${{ github.run_attempt }}"
          KEEP=5
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          test -d "$DEPLOY_ROOT/releases/$RELEASE_NAME" || (echo "Missing release dir" && exit 1)
          test -f "$DEPLOY_ROOT/releases/$RELEASE_NAME/index.html" || (echo "Missing index.html" && exit 1)
          cd "$DEPLOY_ROOT"
          $SUDO_CMD ln -sfn "releases/$RELEASE_NAME" current
          CURRENT_REAL=$($SUDO_CMD readlink -f "$DEPLOY_ROOT/current")
          echo "Active release: $CURRENT_REAL"
          if [ -d "$DEPLOY_ROOT/releases" ]; then
            count=0
            for d in $($SUDO_CMD ls -1t "$DEPLOY_ROOT/releases" 2>/dev/null); do
              [ -d "$DEPLOY_ROOT/releases/$d" ] || continue
              full="$DEPLOY_ROOT/releases/$d"
              real=$($SUDO_CMD readlink -f "$full" 2>/dev/null || true)
              [ "$real" = "$CURRENT_REAL" ] && continue
              count=$((count + 1))
              if [ "$count" -gt "$KEEP" ]; then
                echo "Removing old release: $full"
                $SUDO_CMD rm -rf "$full"
              fi
            done
          fi
          NGINX_BIN=""
          for p in "$(command -v nginx 2>/dev/null || true)" /usr/sbin/nginx /usr/local/sbin/nginx /usr/local/nginx/sbin/nginx; do
            [ -z "$p" ] && continue
            if [ -f "$p" ]; then NGINX_BIN="$p"; break; fi
          done
          if [ -z "$NGINX_BIN" ]; then echo "nginx binary not found (install nginx or set path)"; exit 1; fi
          $SUDO_CMD "$NGINX_BIN" -t
          $SUDO_CMD systemctl reload nginx
          echo "Activated releases/$RELEASE_NAME"

    - name: Configure nginx API proxy
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          
          echo "🔍 Finding nginx configuration file..."
          NGINX_CONFIG=""
          if [ -f "/etc/nginx/sites-available/drivebit.ru" ]; then
            NGINX_CONFIG="/etc/nginx/sites-available/drivebit.ru"
          elif [ -f "/etc/nginx/sites-available/drivebit.my" ]; then
            NGINX_CONFIG="/etc/nginx/sites-available/drivebit.my"
          elif [ -f "/etc/nginx/sites-available/drivebit-clients" ]; then
            NGINX_CONFIG="/etc/nginx/sites-available/drivebit-clients"
          elif [ -f "/etc/nginx/conf.d/drivebit.conf" ]; then
            NGINX_CONFIG="/etc/nginx/conf.d/drivebit.conf"
          else
            echo "⚠️  Nginx config not found in common locations, checking all..."
            $SUDO_CMD find /etc/nginx -name "*drivebit*" -o -name "*default*" 2>/dev/null | head -5
            exit 1
          fi
          
          echo "📝 Using nginx config: $NGINX_CONFIG"
          
          # Backup config
          $SUDO_CMD cp "$NGINX_CONFIG" "${NGINX_CONFIG}.backup.$(date +%Y%m%d_%H%M%S)"
          
          # Check if API proxy already exists
          if grep -q 'location = /' "$NGINX_CONFIG" && grep -q 'return 301.*moskva' "$NGINX_CONFIG"; then
            echo "✅ SEO root redirect / → /moskva already exists"
          else
            echo "⚙️  Adding SEO root redirect (location = / → /moskva)..."
            TEMP_ROOT=$(mktemp)
            printf '    # SEO: canonical home URL (avoid duplicate / vs /moskva)\n    location = / {\n        return 301 https://drivebit.ru/moskva;\n    }\n' > "$TEMP_ROOT"
            $SUDO_CMD sed -i "/^[[:space:]]*location \/[[:space:]]*{/r $TEMP_ROOT" "$NGINX_CONFIG"
            rm -f "$TEMP_ROOT"
            echo "✅ SEO root redirect added"
          fi

          if grep -q "location /api/" "$NGINX_CONFIG"; then
            echo "✅ API proxy configuration already exists"
          else
            echo "⚙️  Adding API proxy configuration..."
            # Create temporary file with API proxy config using printf
            TEMP_CONFIG=$(mktemp)
            printf '    # API proxy to backend\n    location /api/ {\n        proxy_pass http://157.22.252.70:5000/;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        add_header Access-Control-Allow-Origin * always;\n        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;\n        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;\n        if ($request_method = OPTIONS) {\n            return 204;\n        }\n    }\n' > "$TEMP_CONFIG"
            # Insert before location / using sed with file read
            $SUDO_CMD sed -i "/^[[:space:]]*location \/[[:space:]]*{/r $TEMP_CONFIG" "$NGINX_CONFIG"
            rm -f "$TEMP_CONFIG"
            echo "✅ API proxy configuration added"
          fi
          
          # Test nginx config
          echo "🧪 Testing nginx configuration..."
          NGINX_BIN=""
          for p in "$(command -v nginx 2>/dev/null || true)" /usr/sbin/nginx /usr/local/sbin/nginx /usr/local/nginx/sbin/nginx; do
            [ -z "$p" ] && continue
            if [ -f "$p" ]; then NGINX_BIN="$p"; break; fi
          done
          if [ -z "$NGINX_BIN" ]; then echo "nginx binary not found"; exit 1; fi
          $SUDO_CMD "$NGINX_BIN" -t || (echo "❌ Nginx config test failed!" && exit 1)
          
          # Reload nginx
          echo "🔄 Reloading nginx..."
          $SUDO_CMD systemctl reload nginx || $SUDO_CMD systemctl restart nginx
          echo "✅ Nginx reloaded with API proxy configuration"

    - name: Enable nginx static compression (gzip_static, wasm type)
      continue-on-error: true
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          if [ "$EUID" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          CFG="/etc/nginx/conf.d/drivebit_static.conf"
          echo "⚙️  Ensuring nginx static compression settings in $CFG"
          $SUDO_CMD bash -lc "cat > $CFG <<'CONF'\n# drivebit static compression\ngzip_static on;\n# ensure wasm MIME present (in case not in mime.types)\ntypes { application/wasm wasm; }\nCONF"
          
          # Force nginx to reload and clear caches
          echo "🔄 Forcing nginx reload and cache clear..."
          NGINX_BIN=""
          for p in "$(command -v nginx 2>/dev/null || true)" /usr/sbin/nginx /usr/local/sbin/nginx /usr/local/nginx/sbin/nginx; do
            [ -z "$p" ] && continue
            if [ -f "$p" ]; then NGINX_BIN="$p"; break; fi
          done
          if [ -z "$NGINX_BIN" ]; then echo "nginx binary not found"; exit 1; fi
          $SUDO_CMD "$NGINX_BIN" -t
          $SUDO_CMD systemctl reload nginx
          echo "Nginx reloaded (static compression conf)"

    - name: Verify deployed page title
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
          test -f "$DEPLOY_ROOT/current/index.html" || (echo "index.html missing under current" && exit 1)
          echo "Page title from active release:"
          grep -o '<title>[^<]*' -m1 "$DEPLOY_ROOT/current/index.html" || true
          readlink -f "$DEPLOY_ROOT/current" || true

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Fast web version deployed successfully!"
        echo "📁 Active symlink: ${{ env.DEPLOY_ROOT }}/current → releases/${{ github.run_id }}-${{ github.run_attempt }}"
        echo "🌐 Fast web app is now live at: http://${{ secrets.SERVER_DOMAIN || secrets.SERVER_HOST }}/"
        echo "🚀 Loads 10x faster than WASM version!"
        echo "🔧 Nginx configured and serving the application"

    - name: Debug deployment state
      if: failure()
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          DR="${{ env.DEPLOY_ROOT }}"
          echo "Debugging atomic deploy..."
          ls -la "$DR" || true
          echo "current ->"; readlink "$DR/current" || true
          echo "current resolved:"; readlink -f "$DR/current" || true
          echo "releases:"; ls -la "$DR/releases" || true
          R="$DR/releases/${{ github.run_id }}-${{ github.run_attempt }}"
          echo "This run release dir $R:"; ls -la "$R" 2>/dev/null || true
          test -f "$DR/current/index.html" && echo "current/index.html ok" || echo "current/index.html missing"

    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."
        echo ""
        echo "Common issues:"
        echo "1. SSH connection failed - check SERVER_SSH_KEY secret"
        echo "2. index.html not found - check if file was copied"
        echo "3. Images directory missing - might be OK if images are in resources"
        echo "4. Permission denied - check SERVER_USER permissions"
