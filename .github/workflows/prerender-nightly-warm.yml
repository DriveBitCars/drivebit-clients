name: Prerender nightly warm

on:
  schedule:
    # 00:15 UTC ≈ 03:15 MSK — один прогрев суток, минимум нагрузки в пик.
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify GitHub Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_USER }}" ] || [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "❌ Нужны SERVER_HOST, SERVER_USER, SERVER_SSH_KEY (как в deploy)."
            exit 1
          fi
          echo "✅ Секреты для SSH заданы"

      - name: Copy nightly warm script to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "scripts/warm-prerender-nightly.sh"
          target: "/tmp/"
          strip_components: 1

      - name: Run nightly warm on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            SCRIPT=""
            for p in /tmp/warm-prerender-nightly.sh /tmp/scripts/warm-prerender-nightly.sh; do
              if [ -f "$p" ]; then SCRIPT="$p"; break; fi
            done
            if [ -z "$SCRIPT" ]; then
              SCRIPT=$(find /tmp -maxdepth 4 -name 'warm-prerender-nightly.sh' -type f 2>/dev/null | head -1)
            fi
            if [ -z "$SCRIPT" ] || [ ! -f "$SCRIPT" ]; then
              echo "❌ warm-prerender-nightly.sh не найден под /tmp"
              exit 1
            fi
            chmod +x "$SCRIPT"
            export SITE_URL="${SITE_URL:-https://drivebit.ru}"
            "$SCRIPT"
