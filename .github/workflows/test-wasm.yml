name: WASM Test

on:
  pull_request:
    branches: [ trunk ]
  push:
    branches: [ trunk ]

jobs:
  wasm-test:
    name: WASM Distribution Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
        key: wasm-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          wasm-gradle-
          gradle-

    - name: Cache Kotlin/JS (Node/Yarn) tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/nodejs
          ~/.gradle/yarn
          ~/.gradle/kotlin-js-store
          ~/.cache/yarn
          kotlin-js-store/
        key: wasm-kotlin-js-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/package.json', '**/yarn.lock', 'kotlin-js-store/yarn.lock', 'kotlin-js-store/wasm/yarn.lock') }}
        restore-keys: |
          wasm-kotlin-js-
          fast-kotlin-js-
          check-kotlin-js-

    - name: Cache build outputs
      uses: actions/cache@v4
      with:
        path: |
          build/
          .gradle/
          ~/.gradle/build-cache/
        key: wasm-build-${{ hashFiles('**/*.kt', '**/*.gradle*') }}
        restore-keys: |
          wasm-build-
          build-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Update yarn lock
      run: ./gradlew kotlinUpgradeYarnLock kotlinStoreYarnLock --no-daemon || true

    - name: Clean dist (avoid stale cache)
      run: rm -rf composeApp/build/dist carDetailApp/build/dist myCarsApp/build/dist chatsApp/build/dist authApp/build/dist accountApp/build/dist profileApp/build/dist

    - name: Build JS Browser Distribution
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: ./gradlew :composeApp:jsBrowserDistribution :carDetailApp:jsBrowserDistribution :myCarsApp:jsBrowserDistribution :chatsApp:jsBrowserDistribution :authApp:jsBrowserDistribution :accountApp:jsBrowserDistribution :profileApp:jsBrowserDistribution --no-daemon --stacktrace --no-parallel --no-build-cache

    - name: Check JS bundles for skiko references
      run: |
        check_js_no_skiko() {
          local js_file="$1"
          if [ ! -f "$js_file" ]; then
            echo "❌ JS bundle not found: $js_file"
            exit 1
          fi
          if grep -i "skiko" "$js_file"; then
            echo "❌ Found 'skiko' references in $js_file"
            exit 1
          fi
          echo "✅ No 'skiko' references in $js_file"
        }

        check_js_no_skiko "composeApp/build/dist/js/productionExecutable/composeApp.js"
        check_js_no_skiko "carDetailApp/build/dist/js/productionExecutable/carDetail.js"
        check_js_no_skiko "myCarsApp/build/dist/js/productionExecutable/myCars.js"
        check_js_no_skiko "chatsApp/build/dist/js/productionExecutable/chats.js"
        check_js_no_skiko "authApp/build/dist/js/productionExecutable/auth.js"
        check_js_no_skiko "accountApp/build/dist/js/productionExecutable/account.js"
        check_js_no_skiko "profileApp/build/dist/js/productionExecutable/profile.js"

    - name: Check dist for skiko artifacts
      run: |
        for dist_dir in \
          composeApp/build/dist/js/productionExecutable \
          carDetailApp/build/dist/js/productionExecutable \
          myCarsApp/build/dist/js/productionExecutable \
          chatsApp/build/dist/js/productionExecutable \
          authApp/build/dist/js/productionExecutable \
          accountApp/build/dist/js/productionExecutable \
          profileApp/build/dist/js/productionExecutable; do
          if find "$dist_dir" -maxdepth 1 \( -iname '*skiko*' -o -name 'js-reexport-symbols.mjs' \) | grep -q .; then
            echo "❌ Skiko/WASM artifacts found in $dist_dir:"
            find "$dist_dir" -maxdepth 1 \( -iname '*skiko*' -o -name 'js-reexport-symbols.mjs' \)
            exit 1
          fi
          echo "✅ No skiko artifacts in $dist_dir"
        done

    - name: Verify file structure
      run: |
        echo "📁 composeApp build output:"
        find composeApp/build/dist/js/productionExecutable -maxdepth 1 -type f -name "*.js" | head -10
        ls -lh composeApp/build/dist/js/productionExecutable/composeApp.js 2>/dev/null || echo "composeApp.js not found"
        echo ""
        echo "📁 carDetailApp build output:"
        find carDetailApp/build/dist/js/productionExecutable -maxdepth 1 -type f -name "*.js" | head -10
        ls -lh carDetailApp/build/dist/js/productionExecutable/carDetail.js 2>/dev/null || echo "carDetail.js not found"
        echo ""
        echo "📁 myCarsApp build output:"
        find myCarsApp/build/dist/js/productionExecutable -maxdepth 1 -type f -name "*.js" | head -10
        ls -lh myCarsApp/build/dist/js/productionExecutable/myCars.js 2>/dev/null || echo "myCars.js not found"
        echo ""
        echo "📁 chatsApp build output:"
        find chatsApp/build/dist/js/productionExecutable -maxdepth 1 -type f -name "*.js" | head -10
        ls -lh chatsApp/build/dist/js/productionExecutable/chats.js 2>/dev/null || echo "chats.js not found"
        echo ""
        echo "📁 authApp build output:"
        ls -lh authApp/build/dist/js/productionExecutable/auth.js 2>/dev/null || echo "auth.js not found"
        echo ""
        echo "📁 accountApp build output:"
        ls -lh accountApp/build/dist/js/productionExecutable/account.js 2>/dev/null || echo "account.js not found"
        echo ""
        echo "📁 profileApp build output:"
        ls -lh profileApp/build/dist/js/productionExecutable/profile.js 2>/dev/null || echo "profile.js not found"

    - name: Upload logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: wasm-test-logs
        path: |
          composeApp/build/dist/
          carDetailApp/build/dist/
          myCarsApp/build/dist/
          chatsApp/build/dist/
          authApp/build/dist/
          accountApp/build/dist/
          profileApp/build/dist/
          build/js/yarn-error.log
        if-no-files-found: ignore
        retention-days: 7
