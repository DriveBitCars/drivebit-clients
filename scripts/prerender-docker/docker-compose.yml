services:
  prerender:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      CHROME_LOCATION: /usr/bin/chromium
      PAGE_LOAD_TIMEOUT: "60000"
      LOG_REQUESTS: "false"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
